spring.application.name=tradescout

# Database connection settings
spring.datasource.url=jdbc:postgresql://localhost:5432/Local
spring.datasource.username=tradescout
spring.datasource.password=temp_pass

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000
app.jwt.secret=your_super_secret_base64_encoded_key_that_is_at_least_32_bytes_long_12345